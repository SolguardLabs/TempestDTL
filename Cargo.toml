[package]
name = "tempest_dtl"
version = "1.0.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"

[lib]
name = "tempest_dtl"
path = "src/lib.rs"

[[bin]]
name = "tempest-dtl"
path = "src/main.rs"
